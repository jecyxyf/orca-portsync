<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PortSync</title>
  <link rel="stylesheet" href="./panel.css">
  <script type="module" src="./panel.mjs"></script>
</head>
<body>
  <main>
    <label for="workspace">远程工作区</label>
    <select id="workspace" disabled>
      <option>正在读取工作区…</option>
    </select>
    <p id="path" class="muted" hidden></p>

    <form id="settings" hidden>
      <div class="settings-actions">
        <label class="check"><input id="enabled" type="checkbox"> 自动嗅探并转发</label>
        <button id="save" type="submit">保存</button>
      </div>
      <details id="connection">
        <summary>SSH 连接设置</summary>
        <label for="alias" id="alias-label">OpenSSH 主机别名</label>
        <input id="alias" placeholder="例如 devbox" maxlength="253" spellcheck="false" autocomplete="off">
      </details>
    </form>

    <p id="message" role="status" class="muted"></p>
    <section id="manual" hidden>
      <h2>手动转发</h2>
      <form id="manual-form">
        <div class="port-fields">
          <label for="remote-port">远端端口
            <input id="remote-port" type="number" min="1" max="65535" step="1" required>
          </label>
          <label for="local-port">本机端口
            <input id="local-port" type="number" min="1" max="65535" step="1" required>
          </label>
        </div>
        <button id="add" type="submit">添加转发</button>
      </form>
    </section>
    <section id="forwarding" aria-label="项目端口" hidden>
      <h2>项目端口</h2>
      <div class="port-columns muted">
        <span>远端地址</span><span>本机地址</span><span>来源</span>
      </div>
      <ul id="ports"></ul>
    </section>
  </main>
</body>
</html>
